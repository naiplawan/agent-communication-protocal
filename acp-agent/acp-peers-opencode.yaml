config_version: 1

this_agent:
  agent_id: opencode-agent
  machine_id: opencode-machine
  http_endpoint: http://localhost:8444
  capabilities:
    - agent

peers:
  - agent_id: naiplawan-agent
    machine_id: naiplawan-machine
    # The relay is the reachable endpoint; it routes by recipient identity.
    http_endpoint: http://localhost:8443
    capabilities:
      - signaling
      - agent

  - agent_id: acp-relay
    machine_id: relay
    http_endpoint: http://localhost:8443
    capabilities:
      - relay
      - registry

security:
  default_auth_type: signed-token
  token_ttl_seconds: 3600
  require_https: false
